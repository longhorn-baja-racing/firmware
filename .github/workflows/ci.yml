name: ci

on:
  push:
    branches: [main, esp32-development]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    name: host tests (${{ matrix.cc }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure (warnings as errors, ASan + UBSan)
        run: cmake -S dev -B build-dev -G Ninja -DCMAKE_C_COMPILER=${{ matrix.cc }}
      - name: Build (unit tests, fixtures, simulator)
        run: cmake --build build-dev
      - name: Test (unit tests, golden fixtures, simulator scenarios)
        run: ctest --test-dir build-dev --output-on-failure
      - name: Simulator output decodes with the reference decoder
        run: |
          for f in build-dev/sim/runs/*/*.LBR; do python3 -I dev/tools/lbr_decode.py log "$f" > /dev/null; done
          python3 -I dev/tools/lbr_decode.py stream build-dev/sim/runs/nominal/usb_stream.bin > /dev/null

  checks:
    name: format, static analysis, decoder
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned tools
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          pip install clang-format==23.1.3 clang-tidy==22.1.8
      - name: Formatting
        run: |
          find car dev -name '*.[ch]' -print0 |
            xargs -0 clang-format --dry-run --Werror
      - name: Source files are ASCII
        run: |
          if git ls-files -z | xargs -0 grep -nIP '[^\x00-\x7F]'; then
            echo "non-ASCII characters found (see above)"; exit 1
          fi
      - name: On-car code does not depend on development code
        run: |
          # car/ is what gets flashed; dev/ (tests, tools, simulator) must never be
          # pulled into it. Comments may mention dev/ paths; build files and
          # includes may not.
          bad=0
          if git grep -nE '^[^#]*\bdev/' -- 'car/**/CMakeLists.txt' 'car/**/*.cmake' 'car/**/sdkconfig.*'; then bad=1; fi
          if git grep -nE '^\s*(o|r|or)?source\s.*(\.\./|dev/)' -- 'car/**/Kconfig*'; then bad=1; fi
          if git grep -nE '^\s*#\s*include\s*["<][^">]*(\.\./|dev/)' -- 'car/**/*.c' 'car/**/*.h'; then bad=1; fi
          if [ $bad -ne 0 ]; then echo "car/ references dev/ (see above)"; exit 1; fi
      - name: Static analysis (clang-tidy on pure sources)
        run: |
          cmake -S dev -B build-dev -G Ninja -DCMAKE_C_COMPILER=clang -DLBR_SANITIZE=OFF
          find car/components -name '*.c' ! -name '*_esp.c' -print0 |
            xargs -0 clang-tidy -p build-dev --quiet
      - name: Reference decoder replays the golden fixtures
        run: python3 -I dev/tools/lbr_decode.py --selftest

  idf-version:
    name: ESP-IDF pin
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.pin.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: pin
        name: Read .idf-version
        run: |
          tag=$(head -n1 .idf-version | tr -d '[:space:]')
          echo "$tag" | grep -Eq '^v[0-9]+\.[0-9]+(\.[0-9]+)?$' || { echo "bad .idf-version: $tag"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  firmware:
    name: ${{ matrix.node }} (${{ matrix.variant }})
    needs: idf-version
    runs-on: ubuntu-24.04
    # The same ESP-IDF release every developer must use (car/cmake/idf_version.cmake).
    container: espressif/idf:${{ needs.idf-version.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        node: [gateway, imu_gps, suspension, driver_inputs, temperature, fuel_gauge, stress, dashboard]
        variant: [default, linkcheck]
    steps:
      - uses: actions/checkout@v4
      - name: Build with warnings as errors
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          extra=""
          if [ "${{ matrix.variant }}" = linkcheck ]; then
            # Placeholder pins so every hardware path is compiled and linked.
            extra="-DLBR_SDKCONFIG_EXTRA=$GITHUB_WORKSPACE/dev/ci/sdkconfig.linkcheck"
          fi
          cd car/nodes/${{ matrix.node }}
          idf.py -B build $extra build
      - name: Size report
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cd car/nodes/${{ matrix.node }} && idf.py -B build size
