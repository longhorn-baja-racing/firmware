name: ci

on:
  push:
    branches: [main, esp32-development]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    name: host tests (${{ matrix.cc }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure (warnings as errors, ASan + UBSan)
        run: cmake -S tests/host -B build-host -G Ninja -DCMAKE_C_COMPILER=${{ matrix.cc }}
      - name: Build
        run: cmake --build build-host
      - name: Test (includes golden fixture check)
        run: ctest --test-dir build-host --output-on-failure

  checks:
    name: format, static analysis, decoder
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned tools
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          pip install clang-format==23.1.3 clang-tidy==22.1.8
      - name: Formatting
        run: |
          find components nodes tests -name '*.[ch]' -print0 |
            xargs -0 clang-format --dry-run --Werror
      - name: Source files are ASCII
        run: |
          if git ls-files -z | xargs -0 grep -nIP '[^\x00-\x7F]'; then
            echo "non-ASCII characters found (see above)"; exit 1
          fi
      - name: Static analysis (clang-tidy on pure sources)
        run: |
          cmake -S tests/host -B build-host -G Ninja -DCMAKE_C_COMPILER=clang -DLBR_SANITIZE=OFF
          find components -name '*.c' ! -name '*_esp.c' -print0 |
            xargs -0 clang-tidy -p build-host --quiet
      - name: Reference decoder replays the golden fixtures
        run: python3 -I tools/lbr_decode.py --selftest

  firmware:
    name: ${{ matrix.node }} (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    container: espressif/idf:v6.1
    strategy:
      fail-fast: false
      matrix:
        node: [gateway, imu_gps, suspension, driver_inputs, temperature, fuel_gauge, stress, dashboard]
        variant: [default, linkcheck]
    steps:
      - uses: actions/checkout@v4
      - name: Build with warnings as errors
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          extra=""
          if [ "${{ matrix.variant }}" = linkcheck ]; then
            # Placeholder pins so every hardware path is compiled and linked.
            extra="-DLBR_SDKCONFIG_EXTRA=$GITHUB_WORKSPACE/tests/ci/sdkconfig.linkcheck"
          fi
          cd nodes/${{ matrix.node }}
          idf.py -B build $extra build
      - name: Size report
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cd nodes/${{ matrix.node }} && idf.py -B build size
