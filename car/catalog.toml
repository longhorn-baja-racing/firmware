# Central: GPS (any NMEA receiver, WGS84) and the cockpit link.

[[frame]]
id = 0x600
name = "GPS_POSITION"
sender = "central"
slot = "gps"
rate_hz = 10
signals = [
  { name = "GPS_LATITUDE",  id = 0x0600, type = "i32", unit = "deg_e7", enc = "i32", desc = "Latitude, 1e-7 degree" },
  { name = "GPS_LONGITUDE", id = 0x0601, type = "i32", unit = "deg_e7", enc = "i32", desc = "Longitude, 1e-7 degree" },
]

[[frame]]
id = 0x601
name = "GPS_MOTION"
sender = "central"
slot = "gps"
rate_hz = 10
counter = true
signals = [
  { name = "GPS_SPEED",    id = 0x0603, unit = "m_per_s", enc = "u16", scale = 0.01, desc = "Ground speed" },
  { name = "GPS_COURSE",   id = 0x0604, unit = "degree",  enc = "u16", scale = 0.01, desc = "Course over ground, true north" },
  { name = "GPS_ALTITUDE", id = 0x0602, unit = "meter",   enc = "i16", scale = 0.1,  desc = "Altitude above mean sea level" },
]

[[frame]]
id = 0x602
name = "GPS_STATUS"
sender = "central"
slot = "gps"
rate_hz = 10
signals = [
  { name = "GPS_UTC",        id = 0x0608, type = "u32",    unit = "unix_s", enc = "u32",  desc = "UTC time of fix, Unix seconds (wall-clock anchor only)" },
  { name = "GPS_FIX",        id = 0x0605, type = "status", unit = "none",   enc = "u8",   desc = "Fix type: 0 none, 1 dead reckoning, 2 2D, 3 3D" },
  { name = "GPS_SATELLITES", id = 0x0606, type = "u32",    unit = "count",  enc = "u8",   desc = "Satellites used in fix" },
  { name = "GPS_HDOP",       id = 0x0607, unit = "none",   enc = "u16",     scale = 0.01, desc = "Horizontal dilution of precision" },
]

[[frame]]
id = 0x60A
name = "COCKPIT_STATUS"
sender = "central"
slot = "cockpit_status"
rate_hz = 1
signals = [
  { name = "COCKPIT_BATTERY", id = 0x0610, unit = "percent", enc = "u8", desc = "Cockpit display battery" },
  { name = "COCKPIT_LINK",    id = 0x0611, type = "bool", unit = "none", enc = "u8", desc = "Cockpit display WiFi link OK" },
]

# --- Signals outside the data frames -------------------------------------------------
# Events and faults travel in the EVENT / FAULT system frames of any node.
# Value: code in bits 0..15, argument in bits 16..31.

[[signal]]
name = "EVENT"
id = 0x0700
type = "status"
unit = "none"
desc = "Event code (see lbr_event_code_t)"

[[signal]]
name = "FAULT"
id = 0x0701
type = "status"
unit = "none"
desc = "Fault/alarm code (see lbr_event_code_t)"

# --- Live links ----------------------------------------------------------------------

[lora]
items = [
  ["ENGINE_RPM", 500], ["CVT_RPM", 500], ["GPS_SPEED", 1000],
  ["TEMP_CVT", 1000], ["TEMP_BRAKE_FL", 2000], ["TEMP_BRAKE_FR", 2000],
  ["TEMP_BRAKE_BL", 2000], ["TEMP_BRAKE_BR", 2000], ["FUEL_LEVEL", 5000],
  ["GPS_LATITUDE", 2000], ["GPS_LONGITUDE", 2000], ["GPS_FIX", 5000],
  ["COCKPIT_BATTERY", 10000], ["CORNER_FL_BATTERY", 10000], ["CORNER_FR_BATTERY", 10000],
  ["CORNER_BL_BATTERY", 10000], ["CORNER_BR_BATTERY", 10000],
]

[cockpit]
signals = [
  "ENGINE_RPM", "GPS_SPEED", "FUEL_LEVEL", "TEMP_CVT", "TEMP_BRAKE_FL", "TEMP_BRAKE_FR",
  "TEMP_BRAKE_BL", "TEMP_BRAKE_BR", "STRESS_1", "STRESS_2", "STRESS_3", "STRESS_4",
  "STRESS_5", "STRESS_6", "STRESS_7", "STRESS_8", "COCKPIT_BATTERY", "CORNER_FL_BATTERY",
  "CORNER_FR_BATTERY", "CORNER_BL_BATTERY", "CORNER_BR_BATTERY",
]
