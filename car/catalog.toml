# The 2026 car's catalog: every node, signal, and CAN data frame, declared once.
#
# lbrlib/tools/lbrgen.py turns this file into the C sources the firmware is
# built from (signals.def, nodes.h, the frame table, every node's plan), the
# node and data-frame tables of docs/can-ids.md, and nothing else. Never edit
# the generated files; edit this one and run
#
#     python3 lbrlib/tools/lbrgen.py car/catalog.toml
#
# CI runs it with --check. It is part of the shared protocol (version 4):
# signal ids, names, types, units, frame ids, layouts, rates, and node ids
# are folded into lbr_catalog_hash(). Changing any of them means
# regenerating the golden fixtures and updating the dashboard app in step.
# Never renumber or reuse a node id, signal id, or CAN id once a log exists.
#
# Reference
# ---------
# [node.<name>]       one per node; <name> is its short lowercase name.
#   id                node id, 1..254. CAN nodes are 1..can_max.
#   board             board description (docs only).
#   about             one line on what it does (docs and generated comments).
#   link              how it is connected (docs only; default "CAN", cockpit "WiFi").
#   role              "central" (logger and time master; exactly one) or
#                     "cockpit" (off the bus, WiFi only; at most one).
#   app               firmware project under car/nodes/ (default: <name>).
#                     Nodes sharing an app get one plan array, indexed in id
#                     order (the corner hubs).
#   slots             acquisition slots in order. "name" takes the slot's
#                     signals from the frames that name it, in frame order;
#                     { name, signals = [...] } lists them (any order, or for
#                     a node off the bus); add rate_hz when no frame says it.
#                     input says how the slot is read, and the board binds
#                     it by itself: "io" (on-chip ADC/pulse/switch inputs,
#                     set in menuconfig as CONFIG_LBR_IO_<SLOT>), "gps" or
#                     "cockpit_link" (the Central only). No input: a part
#                     driver bound in main.c, or NOT_FITTED. hint: what is
#                     usually wired there (menuconfig help).
#   listen_all        receive every frame (the Central). Default false.
#   health_period_ms  heartbeat period. Default 1000.
#
# [[frame]]           one per CAN data frame, sorted by id.
#   id, name, sender, rate_hz
#   slot              the sender's slot whose samples fill this frame.
#   counter           true: 16-bit sample counter in bytes 6..7, dlc 8.
#   signals           fields, packed from byte 0 in order:
#                     { name, id, unit, enc, scale = 1.0, type = "f32", desc }
#                     enc: i16 u16 u8 i32 u32. type: f32 i32 u32 bool status.
#                     unit: none m_per_s2 rad_per_s deg_c rpm m_per_s percent
#                     deg_e7 meter degree count microstrain unix_s bitmask.
#
# [[signal]]          signals that travel in no data frame (events).
# [lora]              items = [[signal, min_interval_ms], ...]: the in-race
#                     LoRa subset, in priority order.
# [cockpit]           signals = [...]: what the Central sends the cockpit
#                     display, in wire order.

can_max = 10

# --- Nodes (DAQ-WIRING.md section 4) -------------------------------------------------

[node.imu]
id = 1
board = "ESP32-C5"
about = "IMU Controller: the chassis IMU"
slots = ["chassis"]

[node.powertrain]
id = 2
board = "ESP32"
about = "Powertrain Controller: fuel level, engine speed, CVT speed"
slots = [
  { name = "speeds", input = "io", hint = "pulse inputs (pickup or hall sensor)" },
  { name = "fuel", input = "io", hint = "an adc input (fuel sender)" },
]

[node.driver_input]
id = 3
board = "ESP32"
about = "Driver Input Controller: brake pedal, gas pedal, steering angle"
slots = [{ name = "inputs", input = "io", hint = "adc inputs (potentiometers)" }]

[node.temperature]
id = 4
board = "ESP32"
about = "Temperature Controller: four brake temperatures, CVT temperature"
slots = [
  { name = "brakes", input = "io", hint = "a thermocouple or IR part driver instead" },
  { name = "cvt", input = "io", hint = "an adc input (NTC thermistor)" },
]

[node.stress]
id = 5
board = "ESP32"
about = "Stress Controller: stress sensors 1..8"
slots = [{ name = "stress", input = "io", hint = "a bridge amplifier/ADC part driver instead (the on-chip ADC is too noisy)" }]

[node.central]
id = 6
board = "ESP32-C5"
about = "Central Controller: logger, time master, LoRa, GPS, cockpit link"
link = "CAN, pit/cockpit WiFi access point, LoRa, USB, BLE"
role = "central"
listen_all = true
slots = [
  { name = "gps", input = "gps", signals = ["GPS_LATITUDE", "GPS_LONGITUDE", "GPS_ALTITUDE", "GPS_SPEED", "GPS_COURSE", "GPS_FIX", "GPS_SATELLITES", "GPS_HDOP", "GPS_UTC"] },
  { name = "cockpit_status", input = "cockpit_link" },
]

[node.corner_fl]
id = 7
board = "Mini ESP32-C5"
about = "FL wheel hub: suspension IMU, own battery"
link = "CAN (own battery)"
app = "corner"
slots = ["imu", { name = "battery", input = "io", hint = "an adc input behind a divider, calibrated in percent" }]

[node.corner_fr]
id = 8
board = "Mini ESP32-C5"
about = "FR wheel hub: suspension IMU, own battery"
link = "CAN (own battery)"
app = "corner"
slots = ["imu", { name = "battery", input = "io", hint = "an adc input behind a divider, calibrated in percent" }]

[node.corner_bl]
id = 9
board = "Mini ESP32-C5"
about = "BL wheel hub: suspension IMU, own battery"
link = "CAN (own battery)"
app = "corner"
slots = ["imu", { name = "battery", input = "io", hint = "an adc input behind a divider, calibrated in percent" }]

[node.corner_br]
id = 10
board = "Mini ESP32-C5"
about = "BR wheel hub: suspension IMU, own battery"
link = "CAN (own battery)"
app = "corner"
slots = ["imu", { name = "battery", input = "io", hint = "an adc input behind a divider, calibrated in percent" }]

[node.cockpit]
id = 11
board = "ESP32-C5"
about = "Cockpit Controller: the driver's display, over WiFi"
link = "WiFi to the Central"
role = "cockpit"
slots = [{ name = "battery", signals = ["COCKPIT_BATTERY"], rate_hz = 1, input = "io", hint = "an adc input behind a divider (ESP32-C5 ADC1: GPIO 1..6), calibrated in percent" }]

# --- Data frames (DAQ-WIRING.md section 7) -------------------------------------------
# Scales marked TBD are provisional until the parts are chosen.

[[frame]]
id = 0x100
name = "DRIVER_INPUTS"
sender = "driver_input"
slot = "inputs"
rate_hz = 100
counter = true
signals = [ # pedals 0.01 %, steering 0.1 deg (TBD)
  { name = "BRAKE_PEDAL",    id = 0x0100, unit = "percent", enc = "i16", scale = 0.01, desc = "Brake pedal compression" },
  { name = "GAS_PEDAL",      id = 0x0101, unit = "percent", enc = "i16", scale = 0.01, desc = "Gas pedal compression" },
  { name = "STEERING_ANGLE", id = 0x0102, unit = "degree",  enc = "i16", scale = 0.1,  desc = "Steering angle" },
]

[[frame]]
id = 0x200
name = "POWERTRAIN_SPEEDS"
sender = "powertrain"
slot = "speeds"
rate_hz = 100
counter = true
signals = [
  { name = "ENGINE_RPM", id = 0x0200, unit = "rpm", enc = "u16", desc = "Engine speed" },
  { name = "CVT_RPM",    id = 0x0201, unit = "rpm", enc = "u16", desc = "CVT speed" },
]

[[frame]]
id = 0x201
name = "FUEL_LEVEL"
sender = "powertrain"
slot = "fuel"
rate_hz = 1
signals = [ # 0.1 % (TBD)
  { name = "FUEL_LEVEL", id = 0x0202, unit = "percent", enc = "i16", scale = 0.1, desc = "Fuel level, percent of usable tank" },
]

